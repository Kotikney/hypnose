<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Задачник — Настройки</title>
  <link rel="shortcut icon" href="media/slonik.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="media/slonik.svg" alt="Задачник" class="logo-icon">
      <span>Задачник</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link">Сегодня</a>
      <a href="zadachi.html" class="nav-link">Все задачи</a>
      <a href="kalendare.html" class="nav-link">Календарь</a>
    </nav>
    <nav class="nav">
      <a href="settings.html" class="nav-link active">Настройки</a>
    </nav>
  </header>
  <main class="container">
    <h2 class="page-title">Настройки</h2>
    <div id="settingsBox">
      <div class="settings-group">
        <div class="settings-row">
          <div>
            <b>Тема оформления</b>
            <div class="settings-desc">Светлая или тёмная</div>
          </div>
          <div>
            <button class="btn" id="lightBtn">Светлая</button>
            <button class="btn" id="darkBtn">Тёмная</button>
          </div>
        </div>
        <div class="settings-row">
          <div>
            <b>Выполненные задачи</b>
            <div class="settings-desc" id="dataInfo">Всего: 0</div>
          </div>
          <button class="btn red" id="clearDone">Удалить выполненные</button>
        </div>
        <div class="settings-row">
          <div>
            <b>Все задачи</b>
            <div class="settings-desc">Удалить всё без возможности вернуть</div>
          </div>
          <button class="btn red" id="clearAll">Удалить все задачи</button>
        </div>
      </div>
    </div>
  </main>
  <script src="scriptik.js"></script>
</body>
</html>
